name: PrismPDF Cloud Assembly Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  assemble-apk:
    name: Build Installable Debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up OpenJDK 17 Environment
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Setup Android SDK Environment
      uses: android-actions/setup-android@v3

    - name: Bootstrap Missing Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.7
        chmod +x gradlew

    - name: Compile and Assemble Debug APK
      run: ./gradlew clean assembleDebug

    - name: Upload Installable Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PrismPDF-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
